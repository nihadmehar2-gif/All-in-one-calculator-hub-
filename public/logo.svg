<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Violet to blue gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <!-- White glow for icon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background with gradient -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Calculator body (white, rounded) -->
  <rect x="146" y="110" width="220" height="292" rx="28" fill="white" opacity="0.98"/>
  
  <!-- Calculator screen (gradient bar) -->
  <rect x="170" y="134" width="172" height="60" rx="12" fill="#1E1B4B"/>
  <text x="328" y="174" font-family="monospace" font-size="28" font-weight="bold" fill="#A78BFA" text-anchor="end">123</text>
  
  <!-- Calculator buttons grid -->
  <!-- Row 1 -->
  <rect x="170" y="214" width="36" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="218" y="214" width="36" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="266" y="214" width="36" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="314" y="214" width="28" height="36" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Row 2 -->
  <rect x="170" y="262" width="36" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="218" y="262" width="36" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="266" y="262" width="36" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="314" y="262" width="28" height="36" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Row 3 -->
  <rect x="170" y="310" width="36" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="218" y="310" width="36" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="266" y="310" width="36" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="314" y="310" width="28" height="36" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Row 4 (wide button) -->
  <rect x="170" y="358" width="132" height="36" rx="8" fill="#E5E7EB"/>
  <rect x="314" y="358" width="28" height="36" rx="8" fill="url(#bgGrad)"/>
</svg>
